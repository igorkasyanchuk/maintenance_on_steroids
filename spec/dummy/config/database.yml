<%# The suite runs on SQLite by default and on PostgreSQL when DB=postgres,
    so the json/binary columns and the locking behaviour are covered on both. %>
<% postgres = ENV["DB"] == "postgres" %>
default: &default
<% if postgres %>
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
<% else %>
  adapter: sqlite3
  <%# Without a busy timeout SQLite raises "database is locked" the instant two
      connections write at once -- which is exactly what happens when the
      dashboard writes a pause/cancel while a worker is mid-run. %>
  timeout: 5000
<% end %>

development:
  <<: *default
  database: "<%= postgres ? 'maintenance_on_steroids_development' : 'db/development.sqlite3' %>"

test:
  <<: *default
  database: "<%= postgres ? 'maintenance_on_steroids_test' : ':memory:' %>"
